; Centralina vicino al termostato (ESP32 classico, es. DevKit V1 / DevKitC).
;   compila:   pio run
;   carica:    pio run -t upload
;   monitor:   pio device monitor
[platformio]
default_envs = esp32dev

[env]
; pioarduino = core Arduino-ESP32 3.x (la piattaforma "espressif32" del registro
; PlatformIO e' ferma al core 2.x). Versione fissata per avere build ripetibili.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; due partizioni app da 1.9 MB: c'e' spazio per l'aggiornamento dal browser
board_build.partitions = min_spiffs.csv
build_flags = -Wall

[env:esp32dev]
board = esp32dev

; Esempio per un'altra scheda: cambia i pin con -D (vedi src/config.h).
; [env:esp32s3]
; board = esp32-s3-devkitc-1
