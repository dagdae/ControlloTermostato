; Nodo sensore a batteria da fissare vicino al termosifone.
;   compila e carica:   pio run -e xiao_esp32c6 -t upload
[platformio]
default_envs = xiao_esp32c6

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_flags = -Wall

; Consigliato: Seeed Studio XIAO ESP32-C6 (~15 uA in deep sleep, caricabatterie integrato)
[env:xiao_esp32c6]
board = seeed_xiao_esp32c6
build_flags = ${env.build_flags} -DARDUINO_XIAO_ESP32C6

[env:xiao_esp32c3]
board = seeed_xiao_esp32c3
build_flags = ${env.build_flags} -DARDUINO_XIAO_ESP32C3

; ESP32 generico: funziona, ma le DevKit con regolatore AMS1117 e LED di
; alimentazione consumano qualche mA anche in deep sleep (batteria in pochi giorni).
[env:esp32dev]
board = esp32dev
